<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mini Project</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        .chart-container {
            width: 600px;
            margin: auto;
        }
    </style>
</head>

<body>

    <h2>Line Chart</h2>
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <h2>Bar Chart</h2>
    <div class="chart-container">
        <canvas id="myChart1"></canvas>
    </div>

    <h2>Pie Chart</h2>
    <div class="chart-container">
        <canvas id="myChart2"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const ctx = document.getElementById('myChart');
        const ctx1 = document.getElementById('myChart1');
        const ctx2 = document.getElementById('myChart2');

        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
        const revenue = [50000, 60000, 55000, 70000, 75000, 80000];
        const expenses = [30000, 35000, 32000, 40000, 42000, 45000];
        const profit = [20000, 25000, 23000, 30000, 33000, 35000];

    // LINE CHART....
        new Chart(ctx, {
            type: 'line',
            data: {
            labels: months,
            datasets: [{
            label: 'Revenue',
            data: revenue,
            borderColor: 'blue',
            fill: true
        },
        {
            label: 'Expenses',
            data: expenses,
            borderColor: 'green',
            fill: true
        },
        {
            label: 'Profit',
            data: profit,
            borderColor: 'red',
            fill: true
        }]
      }});


    // BAR CHART....
        new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: months,
                datasets: [{
                    label: 'Revenue',
                    data: revenue,
                    backgroundColor: 'blue'
                }]
            }
        });


    // PIE CHART....
    new Chart(ctx2, {
        type: 'pie',
        data: {
            labels: ['Reinvestment 40%', 'Salary 35%', 'Miscelleneous 25%'],
            datasets: [{
                data: [40, 35, 25],
                backgroundColor: ['blue', 'red', 'green']
            }]
        }
    });

    </script>
</body>
</html>
